<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 660" width="1500" height="660" role="img" aria-label="Pipeline of the Political Imagination Audit: prompt plan, generation with Stable Diffusion XL, records, automated and blind manual labels, agreement gate, paired-seed analysis, result tables, and the static site. Exploratory analyses feed the result tables." xmlns:c2pa="http://c2pa.org/manifest">
<style>
  text { font-family: "Fira Sans", Helvetica, Arial, sans-serif; fill: #15181D; }
  .t { font-size: 26px; font-weight: 800; }
  .s { font-size: 21px; }
  .f { font-size: 19px; fill: #4A4E55; }
  .box { fill: #F7F8F9; stroke: #15181D; stroke-width: 3; }
  .hum { fill: #F4D93A; stroke: #15181D; stroke-width: 3; }
  .arr { stroke: #15181D; stroke-width: 3.5; fill: none; marker-end: url(#a); }
  .dash { stroke: #15181D; stroke-width: 3.5; fill: none; stroke-dasharray: 10 8; marker-end: url(#a); }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181D"/></marker></defs>
<rect width="1500" height="660" fill="#E6E8EA"/>
<text x="20" y="36" class="t" style="font-size:30px">How the audit fits together</text>
<rect x="1040" y="14" width="22" height="22" class="hum"/>
<text x="1072" y="33" class="f">includes human labeling</text>

<!-- row 1 -->
<rect x="20" y="70" width="320" height="140" class="box"/>
<text x="38" y="106" class="t">1 Plan</text>
<text x="38" y="138" class="s">5 labels × 2 genders ×</text>
<text x="38" y="162" class="s">5 stated groups × 15 seeds</text>
<text x="38" y="190" class="f">generate.py plan</text>

<rect x="400" y="70" width="320" height="140" class="box"/>
<text x="418" y="106" class="t">2 Generate</text>
<text x="418" y="138" class="s">Stable Diffusion XL base 1.0</text>
<text x="418" y="162" class="s">only the label changes</text>
<text x="418" y="190" class="f">generate.py run, check_run.py</text>

<rect x="780" y="70" width="320" height="140" class="box"/>
<text x="798" y="106" class="t">3 Record</text>
<text x="798" y="138" class="s">750 PNGs + records.jsonl</text>
<text x="798" y="162" class="s">prompt, seed, settings</text>
<text x="798" y="190" class="f">outputs/main-sdxlfast/</text>

<rect x="1160" y="70" width="320" height="140" class="hum"/>
<text x="1178" y="106" class="t">4 Label</text>
<text x="1178" y="138" class="s">VLM labels every image with</text>
<text x="1178" y="162" class="s">codebook v1.0; I label 90 blind</text>
<text x="1178" y="190" class="f">label_vlm.py</text>

<path class="arr" d="M340,140 H396"/>
<path class="arr" d="M720,140 H776"/>
<path class="arr" d="M1100,140 H1156"/>
<path class="arr" d="M1320,210 V296"/>

<!-- row 2 (right to left) -->
<rect x="1160" y="300" width="320" height="140" class="box"/>
<text x="1178" y="336" class="t">5 Agreement gate</text>
<text x="1178" y="368" class="s">kappa or AC1 vs my labels;</text>
<text x="1178" y="392" class="s">failed features: estimate only</text>
<text x="1178" y="420" class="f">agreement.py</text>

<rect x="780" y="300" width="320" height="140" class="box"/>
<text x="798" y="336" class="t">6 Analyze</text>
<text x="798" y="368" class="s">paired by seed; bootstrap over</text>
<text x="798" y="392" class="s">seeds, permutation, Holm</text>
<text x="798" y="420" class="f">analyze.py</text>

<rect x="400" y="300" width="320" height="140" class="box"/>
<text x="418" y="336" class="t">7 Result tables</text>
<text x="418" y="368" class="s">contrasts, rates, agreement,</text>
<text x="418" y="392" class="s">manifest (in the repo)</text>
<text x="418" y="420" class="f">results/</text>

<rect x="20" y="300" width="320" height="140" class="box"/>
<text x="38" y="336" class="t">8 Exhibit</text>
<text x="38" y="368" class="s">static site: walls, compare,</text>
<text x="38" y="392" class="s">results, gallery (GitHub Pages)</text>
<text x="38" y="420" class="f">make_web_assets.py, export_*.py</text>

<path class="arr" d="M1160,370 H1104"/>
<path class="arr" d="M780,370 H724"/>
<path class="arr" d="M400,370 H344"/>

<!-- row 3 exploratory -->
<rect x="400" y="500" width="700" height="140" class="hum"/>
<text x="418" y="536" class="t">Exploratory, added after the main results</text>
<text x="418" y="568" class="s">subgroup and age tables; blind skin-tone labels (no race stated);</text>
<text x="418" y="592" class="s">replication on new seeds 15 to 29 with a written prediction</text>
<text x="418" y="620" class="f">explore_by_group.py, make_skintone_set.py, analyze_skintone.py</text>
<path class="dash" d="M560,500 V444"/>
<path class="dash" d="M940,500 V444"/>
<text x="1120" y="575" class="f">logged in DEVIATIONS D17, D18</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
